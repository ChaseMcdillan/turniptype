<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurnipType — by Chase McDillan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="logo">turnip<span>type</span></h1>
      <p class="tagline">a minimal typing test · built by Chase McDillan</p>
    </header>

    <nav class="toolbar" id="toolbar" aria-label="Test mode">
      <div class="group" id="group-mode"></div>
      <div class="divider" aria-hidden="true"></div>
      <div class="group" id="group-option"></div>
      <div class="spacer"></div>
      <div class="group" id="group-language"></div>
    </nav>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" id="wpm">0</span>
        <span class="stat-label">wpm</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="accuracy">100</span>
        <span class="stat-label">accuracy</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="time">0</span>
        <span class="stat-label" id="time-label">seconds</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="record">—</span>
        <span class="stat-label">best</span>
      </div>
    </section>

    <div class="stage">
      <p id="text" class="text"></p>
      <div class="overlay" id="overlay" hidden>
        <button class="overlay-btn" id="start-btn">start test</button>
        <p class="overlay-hint">or press <kbd>tab</kbd></p>
      </div>
    </div>

    <input
      id="input"
      class="input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="start typing…"
      aria-label="typing input"
      disabled
    />

    <footer class="footer">
      <button id="reset" class="reset" type="button">restart</button>
      <span class="hint">
        <kbd>tab</kbd> focus · <kbd>esc</kbd> restart · <kbd>enter</kbd> next
      </span>
      <span class="credit">
        by <a href="https://github.com/ChaseMcDillan" target="_blank" rel="noopener">Chase McDillan</a>
      </span>
    </footer>

    <!-- ── Results screen ── -->
    <section class="results" id="results" hidden>
      <div class="results-head">
        <div class="big-stat">
          <span class="big-value" id="r-wpm">0</span>
          <span class="big-label">wpm</span>
        </div>
        <div class="big-stat">
          <span class="big-value" id="r-acc">0</span>
          <span class="big-label">accuracy</span>
        </div>
        <div class="badge" id="r-badge" hidden>new best</div>
      </div>

      <div class="graph-wrap">
        <svg id="graph" viewBox="0 0 600 160" preserveAspectRatio="none" aria-label="WPM over time"></svg>
      </div>

      <div class="grid">
        <div class="cell"><span class="cell-value" id="r-raw">0</span><span class="cell-label">raw wpm</span></div>
        <div class="cell"><span class="cell-value" id="r-burst">0</span><span class="cell-label">burst</span></div>
        <div class="cell"><span class="cell-value" id="r-consistency">0</span><span class="cell-label">consistency</span></div>
        <div class="cell"><span class="cell-value" id="r-correct">0</span><span class="cell-label">correct chars</span></div>
        <div class="cell"><span class="cell-value" id="r-wrong">0</span><span class="cell-label">wrong chars</span></div>
        <div class="cell"><span class="cell-value" id="r-time">0</span><span class="cell-label">seconds</span></div>
      </div>

      <div class="results-actions">
        <button class="reset" id="r-again" type="button">try again</button>
        <button class="reset ghost" id="r-change" type="button">change mode</button>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
